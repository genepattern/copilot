name: "MCP - Get Job Details"
description: "Test the get_job_details MCP endpoint to retrieve detailed information about a specific job"
prompt: "First, submit a ConvertLineEndings job using input.filename=https://datasets.genepattern.org/data/all_aml/all_aml_train.cls and output.file=all_aml_train.cvt.cls. Then get the full details for that job, including all input parameters and output files."
combinations:
  - model: "us.anthropic.claude-3-5-haiku-20241022-v1:0"
    method: "mcp"
  - model: "us.anthropic.claude-3-5-haiku-20241022-v1:0"
    method: "rag_mcp"
