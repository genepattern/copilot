{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chatbot Comparator</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .container-fluid {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-input-row {
            padding: 15px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        .content-columns {
            flex-grow: 1;
            display: flex;
            overflow-y: auto;
        }
        .col-md-4 {
            border-right: 1px solid #e9ecef;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .col-md-4:last-child {
            border-right: none;
        }
        .response-header {
            margin-bottom: 10px;
            font-weight: bold;
            display: none; /* Hidden by default */
        }
        .response-box {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            max-height: 100%;
            overflow-y: auto;
            white-space: pre-wrap; /* Preserves whitespace and wraps text */
            word-wrap: break-word; /* Breaks long words */
        }
        .query-box {
            background-color: #e2f0fd;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-style: italic;
        }
        /* Style for the dropdown */
        .model-dropdown {
            margin-right: 15px; /* Add some space between dropdown and toggle */
            width: 150px; /* Adjust width as needed */
        }
        /* Style for the spinner container */
        .spinner-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px; /* Give it some height to center spinner */
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row chat-input-row align-items-center">
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" class="form-control" id="questionInput" placeholder="Type your question here..." aria-label="Question input">
                    <button class="btn btn-primary" type="button" id="sendButton">Send</button>
                </div>
            </div>
            <div class="col-md-4 d-flex align-items-center justify-content-end">
                <select id="llm-models" class="form-select model-dropdown">
                    <option value="gpt-4o-mini">GPT-4o</option>
                    <option value="mistral.mistral-large-2402-v1:0">Mistral</option>
                    <option value="us.anthropic.claude-3-5-haiku-20241022-v1:0" selected>Claude</option>
                    <option value="gemini-2.0-flash">Gemini</option>
                    <option value="us.meta.llama3-3-70b-instruct-v1:0">Llama</option>
                    <option value="us.deepseek.r1-v1:0">DeepSeek</option>
                </select>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="revealToggle">
                    <label class="form-check-label" for="revealToggle">Reveal</label>
                </div>
            </div>
        </div>

        <div class="row content-columns flex-grow-1">
            <div class="col-md-4">
                <h5 class="response-header" id="header-col1">Method: </h5>
                <div id="responseCol1">
                    <div class="spinner-container" id="spinner1" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <h5 class="response-header" id="header-col2">Method: </h5>
                <div id="responseCol2">
                    <div class="spinner-container" id="spinner2" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <h5 class="response-header" id="header-col3">Method: </h5>
                <div id="responseCol3">
                    <div class="spinner-container" id="spinner3" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script>
        const questionInput = document.getElementById('questionInput');
        const sendButton = document.getElementById('sendButton');
        const revealToggle = document.getElementById('revealToggle');
        const llmModelsDropdown = document.getElementById('llm-models');
        const responseCols = [
            document.getElementById('responseCol1'),
            document.getElementById('responseCol2'),
            document.getElementById('responseCol3')
        ];
        const headerCols = [
            document.getElementById('header-col1'),
            document.getElementById('header-col2'),
            document.getElementById('header-col3')
        ];
        const spinners = [ // Array to hold references to spinner elements
            document.getElementById('spinner1'),
            document.getElementById('spinner2'),
            document.getElementById('spinner3')
        ];

        const methods = ['rag', 'mcp', 'raw'];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function sendQuery(query, method_id, columnElement, spinnerElement) {
            const selectedModelId = llmModelsDropdown.value;

            // Show spinner for this column
            spinnerElement.style.display = 'flex'; // Use flex to center the spinner

            const payload = {
                "query": query,
                "method_id": method_id,
                "model_id": selectedModelId,
                "html": true
            };

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error:', error);
                return { query: query, response: `Error: ${error.message}`, ended_at: new Date().toISOString() };
            } finally {
                // Hide spinner regardless of success or failure
                spinnerElement.style.display = 'none';
            }
        }

        function displayResponse(columnElement, query, responseText) {
            // Remove previous content (only query/response, not the spinner)
            // We need to keep the spinner div, so clear its *children* if needed.
            // A safer approach is to manage display of spinner and content.
            // Let's clear the content *below* the header/spinner.
            const contentDiv = columnElement; // Or a dedicated content div if you want more structure

            // Clear previous query/response boxes if they exist
            let currentQueryBox = contentDiv.querySelector('.query-box');
            let currentResponseBox = contentDiv.querySelector('.response-box');
            if (currentQueryBox) currentQueryBox.remove();
            if (currentResponseBox) currentResponseBox.remove();


            const queryBox = document.createElement('div');
            queryBox.classList.add('query-box');
            queryBox.innerHTML = `<strong>You:</strong> ${query}`;
            contentDiv.appendChild(queryBox); // Append, so it's below the header/spinner

            const responseBox = document.createElement('div');
            responseBox.classList.add('response-box');
            responseBox.innerHTML = `<strong>Bot:</strong> ${responseText}`;
            contentDiv.appendChild(responseBox); // Append, so it's below the question
        }

        function clearColumns() {
            responseCols.forEach((col, index) => {
                // Ensure spinners are hidden and content is cleared
                spinners[index].style.display = 'none'; // Hide spinner
                let currentQueryBox = col.querySelector('.query-box');
                let currentResponseBox = col.querySelector('.response-box');
                if (currentQueryBox) currentQueryBox.remove();
                if (currentResponseBox) currentResponseBox.remove();
            });
            headerCols.forEach(header => header.textContent = 'Method: ');
        }

        // Function to synchronize header visibility with the toggle
        function syncRevealToggle() {
            headerCols.forEach(header => {
                if (revealToggle.checked) {
                    header.style.display = 'block';
                } else {
                    header.style.display = 'none';
                }
            });
        }

        sendButton.addEventListener('click', async () => {
            const question = questionInput.value.trim();
            if (question === '') return;

            clearColumns(); // Clear previous responses and hide all spinners
            questionInput.value = ''; // Clear input box

            const shuffledMethods = [...methods];
            shuffleArray(shuffledMethods);

            // Use Promise.all to send requests concurrently
            const tasks = shuffledMethods.map(async (method, index) => {
                headerCols[index].textContent = `Method: ${method.toUpperCase()}`; // Set header immediately
                const responseData = await sendQuery(question, method, responseCols[index], spinners[index]);
                displayResponse(responseCols[index], responseData.query, responseData.response);
            });

            await Promise.all(tasks); // Wait for all requests to complete
        });

        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendButton.click();
            }
        });

        revealToggle.addEventListener('change', syncRevealToggle);

        // Call syncRevealToggle when the page loads to synchronize state
        document.addEventListener('DOMContentLoaded', syncRevealToggle);

    </script>
</body>
</html>
